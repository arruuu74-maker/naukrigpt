<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — NaukriGPT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:420px}
.back{display:inline-block;color:#a78bfa;text-decoration:none;font-size:14px;margin-bottom:20px}
.card{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:20px;padding:32px 28px}
.logo{text-align:center;font-weight:800;font-size:26px;margin-bottom:6px}
.logo span{background:linear-gradient(90deg,#c084fc,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:24px}
.tabs{display:flex;background:rgba(255,255,255,.06);border-radius:12px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;border:none;background:transparent;color:#94a3b8;font-size:14px;font-weight:700;padding:10px;border-radius:9px;cursor:pointer}
.tabs button.active{background:linear-gradient(90deg,#8b5cf6,#2563eb);color:#fff}
label{display:block;font-size:12px;font-weight:700;color:#a78bfa;margin:0 0 6px;text-transform:uppercase;letter-spacing:.5px}
input{width:100%;background:#0d0d20;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;padding:12px;font-size:15px;margin-bottom:14px;font-family:inherit}
input:focus{outline:none;border-color:#8b5cf6}
.btn{width:100%;border:none;background:linear-gradient(90deg,#8b5cf6,#2563eb);color:#fff;font-size:16px;font-weight:800;padding:14px;border-radius:12px;cursor:pointer;margin-top:4px}
.btn:disabled{opacity:.5;cursor:wait}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:#64748b;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
.gbtn{width:100%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font-size:15px;font-weight:700;padding:12px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.gbtn:hover{background:rgba(255,255,255,.09)}
.err{display:none;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;border-radius:10px;padding:12px;font-size:13px;margin-bottom:14px;line-height:1.5}
.perks{margin-top:22px;border-top:1px solid rgba(255,255,255,.08);padding-top:18px}
.perks p{color:#94a3b8;font-size:13px;line-height:2}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="/index.html">← Back to Home</a>
<div class="card">
<div class="logo">Naukri<span>GPT</span></div>
<p class="tagline">Login karo, career growth shuru karo 🚀</p>

<div class="tabs">
<button id="tabLogin" class="active" onclick="showTab('login')">Login</button>
<button id="tabSignup" onclick="showTab('signup')">Sign Up</button>
</div>

<div class="err" id="errBox"></div>

<div id="nameRow" style="display:none">
<label for="name">Tumhara naam</label>
<input type="text" id="name" placeholder="e.g. Aryan Shaoo">
</div>

<label for="email">Email</label>
<input type="email" id="email" placeholder="tum@example.com">

<label for="pass">Password</label>
<input type="password" id="pass" placeholder="Kam se kam 6 characters">

<button class="btn" id="mainBtn" onclick="submit()">🔑 Login</button>

<div class="divider">YA</div>
<button class="gbtn" onclick="googleGo()">
<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
Google se continue karo
</button>

<div class="perks">
<p>✨ Free me milega:<br>
🎟️ 3 AI resume scans har mahine<br>
🤖 AI career counsellor access<br>
👥 Mentors community</p>
</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
let mode = 'login';
const next = new URLSearchParams(location.search).get('next') || '/index.html';

function showTab(m) {
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m === 'login');
  document.getElementById('tabSignup').classList.toggle('active', m === 'signup');
  document.getElementById('nameRow').style.display = m === 'signup' ? 'block' : 'none';
  document.getElementById('mainBtn').textContent = m === 'signup' ? '🚀 Create Account' : '🔑 Login';
  hideErr();
}
function showErr(msg) {
  const e = document.getElementById('errBox');
  e.style.display = 'block';
  e.textContent = msg;
}
function hideErr() { document.getElementById('errBox').style.display = 'none'; }

function friendlyErr(e) {
  const c = e.code || '';
  if (c.includes('user-not-found') || c.includes('wrong-password') || c.includes('invalid-credential'))
    return '❌ Email ya password galat hai. Dobara try karo.';
  if (c.includes('email-already-in-use')) return '❌ Ye email pehle se registered hai. Login karo!';
  if (c.includes('weak-password')) return '❌ Password kam se kam 6 characters ka rakho.';
  if (c.includes('invalid-email')) return '❌ Email sahi format me likho.';
  if (c.includes('popup-closed')) return '❌ Google popup band ho gaya. Dobara try karo.';
  return '❌ ' + (e.message || 'Kuch gadbad ho gayi. Dobara try karo.');
}

async function submit() {
  if (typeof FIREBASE_READY === 'undefined' || !FIREBASE_READY) { showErr('⚠️ Firebase setup abhi baaki hai. FIREBASE-SETUP.md dekho.'); return; }
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const name = document.getElementById('name').value.trim();
  if (!email || !pass) { showErr('❌ Email aur password dono bharo.'); return; }
  if (mode === 'signup' && !name) { showErr('❌ Apna naam bhi likho!'); return; }
  const btn = document.getElementById('mainBtn');
  btn.disabled = true; btn.textContent = '⏳ Ruko...';
  hideErr();
  try {
    await Auth.ready;
    if (mode === 'signup') await Auth.signup(name, email, pass);
    else await Auth.login(email, pass);
    location.href = next;
  } catch (e) { showErr(friendlyErr(e)); }
  btn.disabled = false;
  btn.textContent = mode === 'signup' ? '🚀 Create Account' : '🔑 Login';
}

async function googleGo() {
  if (typeof FIREBASE_READY === 'undefined' || !FIREBASE_READY) { showErr('⚠️ Firebase setup abhi baaki hai. FIREBASE-SETUP.md dekho.'); return; }
  hideErr();
  try {
    await Auth.ready;
    await Auth.googleLogin();
    location.href = next;
  } catch (e) { showErr(friendlyErr(e)); }
}

// Enter dabane pe submit
document.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
